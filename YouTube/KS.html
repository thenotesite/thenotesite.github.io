      function parseCSVLine(line) {
        const regex = /("(?:[^"]|"")*"|[^,]*)(,|$)/g;
        const fields = [];
        let match;
        while ((match = regex.exec(line)) !== null) {
          let val = match[1];
          if (val.startsWith('"') && val.endsWith('"')) {
            val = val.slice(1, -1).replace(/""/g, '"');
          }
          fields.push(val.trim());
          if (match[2] === "") break;
        }
        return fields;
      }

      function formatDuration(str) {
        if (!str) return "";
        const clean = str.trim();
        const hMatch = clean.match(/(\d+)\s*Hours?/i);
        const mMatch = clean.match(/(\d+)\s*Minutes?/i);
        const sMatch = clean.match(/(\d+)\s*Seconds?/i);
        const h = hMatch ? Number(hMatch[1]) : 0;
        const m = mMatch ? Number(mMatch[1]) : 0;
        const s = sMatch ? Number(sMatch[1]) : 0;
        const pad = (n) => String(n).padStart(2, "0");
        return h === 0 ? `${pad(m)}:${pad(s)}` : `${h}:${pad(m)}:${pad(s)}`;
      }

      function isoToDateObject(iso) {
        if (!iso) return null;
        const hasOffset = /Z|[+\-]\d{2}:\d{2}$/.test(iso);
        const normalized = hasOffset ? iso : iso + "Z";
        const d = new Date(normalized);
        return isNaN(d) ? null : d;
      }

      function formatDate(iso) {
        const d = isoToDateObject(iso);
        if (!d) return iso;
        const day = String(d.getUTCDate()).padStart(2, "0");
        const month = d.toLocaleString("en-US", { month: "short", timeZone: "UTC" }).toUpperCase();
        const year = d.getUTCFullYear();
        return `${day} ${month} ${year}`;
      }

      function generateGallery() {
        const lines = videoData
          .trim()
          .split("\n")
          .filter((l) => l && !l.toLowerCase().startsWith("thumbnail"))
          .map(parseCSVLine);

        const total = lines.length;
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        lines.forEach(([thumb, duration, uploaded, url], index) => {
          const videoNumber = total - index; // reverse numbering
          const time = formatDuration(duration || "");
          const date = formatDate(uploaded || "");

          const card = document.createElement("div");
          card.className = "videoCard";
          card.innerHTML = `
            <a href="${url}" target="_blank">
              <div class="thumbnail">
                <img loading="lazy" src="${thumb}">
                <div class="numberBadge">#${videoNumber}</div>
                <div class="overlay">${time}</div>
              </div>
              <div class="info">
                <div class="meta">${date}</div>
              </div>
            </a>
          `;
          gallery.appendChild(card);
        });
      }

      generateGallery();
