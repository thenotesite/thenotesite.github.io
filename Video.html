<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" name="viewport" />
        <link rel="icon" type="image/png" href="lib/icon/vid.png" />
        <title>Video Player</title>
        <style>
            :root {
                --color-bg: #03040b;
                --color-black: #000000;
                --color-white: #ffffff;
                --color-cyan: #3a9399;

                --color-indigo-glow: rgba(99, 102, 241, 0.15);
                --color-purple-glow: rgba(168, 85, 247, 0.15);
                --color-cyan-glow: rgba(6, 182, 212, 0.12);

                --color-grid: rgba(255, 255, 255, 0.04);

                --color-button: rgba(10, 10, 15, 0.8);

                --color-white-border: rgba(255, 255, 255, 0.15);
                --color-white-hover: rgba(255, 255, 255, 0.05);
                --color-white-border-hover: rgba(255, 255, 255, 0.4);
                --color-white-shadow: rgba(255, 255, 255, 0.1);

                --color-panel: rgba(0, 10, 30, 0.4);

                --color-cyan-border: rgba(0, 240, 255, 0.3);
                --color-cyan-shadow: rgba(0, 240, 255, 0.15);
                --color-cyan-inset: rgba(0, 240, 255, 0.1);
                --color-cyan-frame: rgba(0, 240, 255, 0.15);

                --color-purple-shadow: rgba(168, 85, 247, 0.4);
                --color-black-shadow: rgba(0, 0, 0, 0.8);

                --color-action-text: rgba(255, 255, 255, 0.75);
                --color-action-bg: rgba(5, 15, 30, 0.75);
                --color-action-border: rgba(255, 255, 255, 0.25);
                --color-action-shadow: rgba(0, 0, 0, 0.25);
                --color-action-inset: rgba(50, 100, 150, 0.05);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                background-color: var(--color-bg);
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                position: relative;
            }

            body::before {
                content: "";
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                z-index: -2;
                background: radial-gradient(circle at 50% 50%, var(--color-indigo-glow) 0%, transparent 40%),
                    radial-gradient(circle at 80% 20%, var(--color-purple-glow) 0%, transparent 30%),
                    radial-gradient(circle at 20% 80%, var(--color-cyan-glow) 0%, transparent 40%);
                animation: rotatePlasma 30s linear infinite;
            }

            body::after {
                content: "";
                position: absolute;
                inset: 0;
                z-index: -1;
                background-image: linear-gradient(var(--color-grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
                background-size: 60px 60px;
                background-position: center center;
                mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 80%);
                -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 80%);
            }

            label {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 16px 40px;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.5px;
                color: var(--color-white);
                background-color: var(--color-button);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid var(--color-white-border);
                border-radius: 50px;
                cursor: pointer;
                box-shadow: 0 10px 30px -10px var(--color-black-shadow);
                transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
                z-index: 10;
                position: relative;
            }

            label:hover {
                background-color: var(--color-white-hover);
                border-color: var(--color-white-border-hover);
                box-shadow: 0 10px 40px -10px var(--color-purple-shadow);
                transform: translateY(-3px);
            }

            label:active {
                transform: translateY(1px);
                box-shadow: 0 5px 15px -5px var(--color-white-shadow);
            }

            label svg {
                transition: transform 0.3s ease;
            }

            label:hover svg {
                transform: translateY(-2px);
            }

            input {
                display: none;
            }

            #video-wrapper {
                display: none;
                position: relative;
                width: 90vw;
                max-width: 1000px;
                background: var(--color-panel);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid var(--color-cyan-border);
                box-shadow:
                    0 0 40px var(--color-cyan-shadow),
                    inset 0 0 30px var(--color-cyan-inset);
                padding: 4px;
                z-index: 10;
                animation: glitchLoad 0.5s ease-out forwards;
            }

            #video-wrapper::before {
                content: "";
                position: absolute;
                inset: -20px;
                border: 1px solid var(--color-cyan-frame);
                pointer-events: none;
                z-index: -1;
            }

            #video-wrapper::after {
                content: "";
                position: absolute;
                inset: -6px;
                background:
                    linear-gradient(var(--color-cyan), var(--color-cyan)) top left,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) top left,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) top right,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) top right,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) bottom left,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) bottom left,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) bottom right,
                    linear-gradient(var(--color-cyan), var(--color-cyan)) bottom right;
                background-size:
                    40px 3px,
                    3px 40px;
                background-repeat: no-repeat;
                pointer-events: none;
                z-index: 5;
            }

            video {
                display: block;
                width: 100%;
                max-height: 80vh;
                object-fit: contain;
                background-color: var(--color-black);
                outline: none;
                border: none;
            }

            #video-action {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 44px;
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--color-action-text);
                background: var(--color-action-bg);
                border: 1px solid var(--color-action-border);
                border-radius: 50%;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow:
                    0 6px 20px var(--color-action-shadow),
                    inset 0 0 12px var(--color-action-inset);
                transform: translate(-50%, -50%) scale(0.72);
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                z-index: 20;
                transition:
                    opacity 0.2s ease,
                    transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
                    visibility 0.2s ease;
            }

            #video-action.show {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -50%) scale(1);
            }

            #video-action svg {
                width: 17px;
                height: 17px;
                display: block;
            }

            #video-action.playing svg {
                width: 16px;
                height: 16px;
            }

            @keyframes rotatePlasma {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes glitchLoad {
                0% {
                    filter: contrast(500%) hue-rotate(90deg);
                    opacity: 0;
                    transform: scale(0.95);
                }

                100% {
                    filter: contrast(100%) hue-rotate(0deg);
                    opacity: 1;
                    transform: scale(1);
                }
            }
        </style>
    </head>

    <body>
        <label for="file">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Upload Video
        </label>

        <input id="file" type="file" accept="video/*" />

        <div id="video-wrapper">
            <video id="video" playsinline></video>

            <div id="video-action" aria-hidden="true">
                <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5.5L19 12L8 18.5V5.5Z"></path>
                </svg>

                <svg
                    id="pause-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    style="display: none"
                >
                    <path d="M8 6V18"></path>
                    <path d="M16 6V18"></path>
                </svg>
            </div>
        </div>

        <script>
            const file = document.getElementById("file");
            const video = document.getElementById("video");
            const wrapper = document.getElementById("video-wrapper");
            const action = document.getElementById("video-action");
            const playIcon = document.getElementById("play-icon");
            const pauseIcon = document.getElementById("pause-icon");

            let controlsHidden = true;
            let actionTimer;

            function updateActionIcon() {
                if (video.paused) {
                    playIcon.style.display = "block";
                    pauseIcon.style.display = "none";
                    action.classList.remove("playing");
                } else {
                    playIcon.style.display = "none";
                    pauseIcon.style.display = "block";
                    action.classList.add("playing");
                }
            }

            function showAction() {
                if (!controlsHidden) {
                    return;
                }

                updateActionIcon();
                clearTimeout(actionTimer);
                action.classList.remove("show");
                void action.offsetWidth;
                action.classList.add("show");

                actionTimer = setTimeout(() => {
                    action.classList.remove("show");
                }, 700);
            }

            file.onchange = () => {
                if (file.files[0]) {
                    video.src = URL.createObjectURL(file.files[0]);
                    wrapper.style.display = "block";
                    file.previousElementSibling.style.display = "none";
                    video.play();
                }
            };

            video.onclick = () => {
                if (controlsHidden) {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }

                    showAction();
                }
            };

            document.onkeydown = (e) => {
                if (!video.src) {
                    return;
                }

                if (e.key.toLowerCase() === "h") {
                    controlsHidden = !controlsHidden;
                    video.controls = !controlsHidden;

                    if (controlsHidden) {
                        video.blur();
                    } else {
                        action.classList.remove("show");
                        clearTimeout(actionTimer);
                    }

                    return;
                }

                if (e.key === "ArrowLeft") {
                    video.currentTime = Math.max(0, video.currentTime - 10);

                    return;
                }

                if (e.key === "ArrowRight") {
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);

                    return;
                }

                if (e.key === " ") {
                    e.preventDefault();

                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }

                    showAction();
                }
            };
        </script>
    </body>
</html>
